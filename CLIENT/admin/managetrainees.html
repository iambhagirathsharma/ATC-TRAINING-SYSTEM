<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Trainees</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="../css/dashboard.css">

</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Manage Trainees
        </h2>

        <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addTraineeModal">

            <i class="bi bi-person-plus"></i>
            Add Trainee

        </button>

    </div>

    <!-- Table -->

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Employee No</th>

                    <th>Unit</th>

                    <th>Username</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="traineeTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Add Trainee Modal -->

<div
class="modal fade"
id="addTraineeModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5>
Add New Trainee
</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="traineeForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>
Full Name
</label>

<input
type="text"
class="form-control"
id="name">

</div>

<div class="col-md-6 mb-3">

<label>
Employee Number
</label>

<input
type="text"
class="form-control"
id="employeeNo">

</div>

<div class="col-md-6 mb-3">

<label>
Username
</label>

<input
type="text"
class="form-control"
id="username">

</div>

<div class="col-md-6 mb-3">

<label>
Password
</label>

<input
type="password"
class="form-control"
id="password">

</div>

<div class="col-md-6 mb-3">

<label>
Unit
</label>

<select
class="form-select"
id="unit">

<option>
ADC
</option>

<option>
ADC + APP(P)
</option>

<option>
APP(P)
</option>

<option>
APP(S)
</option>

<option>
APP(S)+APP(P)
</option>

<option>
ACC(P)/OCC
</option>

<option>
ACC(S)
</option>

<option>
ACC(P)+ACC(S)
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>
Joining Date
</label>

<input
type="date"
class="form-control"
id="joiningDate">

</div>

<div class="col-md-6 mb-3">

<label>
Required OJT Hours
</label>

<input
type="number"
class="form-control"
id="requiredHours"
value="180">

</div>

<div class="col-md-6 mb-3">

<label>
Required Days
</label>

<input
type="number"
class="form-control"
id="requiredDays"
value="90">

</div>

</div>

</form>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Close

</button>

<button
type="button"
class="btn btn-primary"
id="saveTraineeBtn">

Save Trainee

</button>

</div>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/manage-trainees.js"></script>
</body>
</html>
