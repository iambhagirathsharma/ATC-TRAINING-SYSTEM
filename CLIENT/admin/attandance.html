<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

.page-header{
    background:#0D47A1;
    color:white;
    padding:20px;
}

.filter-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.table-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.badge-approved{
    background:#198754;
}

.badge-pending{
    background:#ffc107;
    color:black;
}

.badge-rejected{
    background:#dc3545;
}

</style>

</head>

<body>

<div class="page-header">

    <div class="container-fluid">

        <h3>
            Attendance Management
        </h3>

        <p>
            Monitor and Manage Trainee Attendance
        </p>

    </div>

</div>

<div class="container-fluid py-4">

    <!-- Filters -->

    <div class="filter-card mb-4">

        <div class="row">

            <div class="col-md-3">

                <label>
                    Unit
                </label>

                <select class="form-select">

                    <option>All Units</option>

                    <option>ADC</option>

                    <option>ADC + APP(P)</option>

                    <option>APP(P)</option>

                    <option>APP(S)</option>

                    <option>APP(S)+APP(P)</option>

                    <option>ACC(P)/OCC</option>

                    <option>ACC(S)</option>

                    <option>ACC(P)+ACC(S)</option>

                </select>

            </div>

            <div class="col-md-3">

                <label>
                    Training Type
                </label>

                <select class="form-select">

                    <option>All</option>

                    <option>OJT</option>

                    <option>Theory</option>

                </select>

            </div>

            <div class="col-md-3">

                <label>
                    Date
                </label>

                <input
                type="date"
                class="form-control">

            </div>

            <div class="col-md-3 d-flex align-items-end">

                <button
                class="btn btn-primary w-100">

                Filter

                </button>

            </div>

        </div>

    </div>

    <!-- Attendance Table -->

    <div class="table-card">

        <h4 class="mb-3">

            Attendance Records

        </h4>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Unit</th>

                    <th>Date</th>

                    <th>Type</th>

                    <th>From</th>

                    <th>To</th>

                    <th>Hours</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr>

                    <td>1</td>

                    <td>Ashish Gupta</td>

                    <td>ADC</td>

                    <td>19-06-2026</td>

                    <td>OJT</td>

                    <td>09:00</td>

                    <td>11:00</td>

                    <td>2</td>

                    <td>

                        <span
                        class="badge badge-approved">

                        Approved

                        </span>

                    </td>

                    <td>

                        <button
                        class="btn btn-sm btn-warning">

                        <i class="bi bi-pencil"></i>

                        </button>

                        <button
                        class="btn btn-sm btn-danger">

                        <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>

                <tr>

                    <td>2</td>

                    <td>Rahul Sharma</td>

                    <td>APP(P)</td>

                    <td>19-06-2026</td>

                    <td>Theory</td>

                    <td>10:00</td>

                    <td>12:00</td>

                    <td>2</td>

                    <td>

                        <span
                        class="badge badge-pending">

                        Pending

                        </span>

                    </td>

                    <td>

                        <button
                        class="btn btn-sm btn-success">

                        <i class="bi bi-check-lg"></i>

                        </button>

                        <button
                        class="btn btn-sm btn-danger">

                        <i class="bi bi-x-lg"></i>

                        </button>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
