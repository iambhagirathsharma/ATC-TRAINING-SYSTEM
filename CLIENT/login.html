<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATC Training Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="overlay"></div>

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->

        <div class="logo-section">

            <img
            src="images/aai-logo.png"
            alt="AAI Logo"
            class="aai-logo">

            <h2>
                Training Management System
            </h2>

            <p>
                Airports Authority of India
            </p>

        </div>

        <!-- Role Selection -->

        <div class="role-selection">

            <button
            type="button"
            class="role-btn active"
            id="adminBtn">

            Admin

            </button>

            <button
            type="button"
            class="role-btn"
            id="traineeBtn">

            Trainee

            </button>

        </div>

        <!-- Login Form -->

        <form id="loginForm">

            <input
            type="hidden"
            id="role"
            value="admin">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Enter Username"
                required>

            </div>

            <div class="mb-2">

                <label class="form-label">
                    Password
                </label>

                <div class="position-relative">

                    <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter Password"
                    required>

                    <i
                    class="bi bi-eye-slash password-toggle"
                    id="togglePassword"></i>

                </div>

            </div>

            <div class="text-end mb-3">

                <a
                href="#"
                class="forgot-link"
                id="forgotPassword">

                Forgot Password?

                </a>

            </div>

            <button
            type="submit"
            class="login-btn">

            Login

            </button>

        </form>

        <div class="footer-text">

            Air Traffic Control Trainee Management System

        </div>

    </div>

</div>

<script>

const adminBtn =
document.getElementById(
"adminBtn"
);

const traineeBtn =
document.getElementById(
"traineeBtn"
);

const role =
document.getElementById(
"role"
);

adminBtn.addEventListener(
"click",
function(){

adminBtn.classList.add(
"active"
);

traineeBtn.classList.remove(
"active"
);

role.value =
"admin";

});

traineeBtn.addEventListener(
"click",
function(){

traineeBtn.classList.add(
"active"
);

adminBtn.classList.remove(
"active"
);

role.value =
"trainee";

});

const password =
document.getElementById(
"password"
);

const togglePassword =
document.getElementById(
"togglePassword"
);

togglePassword.addEventListener(
"click",
function(){

if(password.type==="password")
{
password.type="text";

togglePassword.classList.remove(
"bi-eye-slash"
);

togglePassword.classList.add(
"bi-eye"
);
}
else
{
password.type="password";

togglePassword.classList.remove(
"bi-eye"
);

togglePassword.classList.add(
"bi-eye-slash"
);
}

});

document.getElementById(
"forgotPassword"
).addEventListener(
"click",
function(e){

e.preventDefault();

alert(
"Please contact Administrator to reset your password."
);

});


</script>
<script src="js/auth.js"></script>
</body>
</html>
